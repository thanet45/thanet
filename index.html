<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/gas-station.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/gas-station.png">
  <title>ระบบรับ-จ่ายน้ำมัน</title>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #4a543f; }
    iframe { width: 100%; height: 100%; border: none; }
    
    /* 📍 โค้ดนี้ช่วยปลดล็อกกรอบ iframe เพื่อให้เครื่องพิมพ์เห็นข้อมูลทุกหน้ายาวลงไปด้านล่างได้แบบไม่โดนตัด */
    @media print {
        body, html { height: auto !important; overflow: visible !important; display: block !important; }
        iframe { height: 100vh !important; min-height: 1500px !important; overflow: visible !important; display: block !important; }
    }
  </style>
</head>
<body>

  <!-- 📍 นำลิงก์ Web App จาก Google Apps Script (ที่ลงท้ายด้วย /exec) มาใส่ด้านล่างนี้ -->
  <iframe src="https://script.google.com/macros/s/AKfycbwK0amhKTv7pdUvYak02hASB_SsYWCWSsYk-DMwTw7Ytv5l_SHCg9XRa36hEwZZw8BcUQ/exec"></iframe>

</body>
</html>
